<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetricsHub - Dashboard</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. NAVBAR (Dùng Flexbox - 1D) -->
    <nav class="navbar-custom">
      <div class="logo">MetricsHub</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">VeryLongGermanWordForDashboard</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="user-profile">Profile</div>
    </nav>

    <div class="container my-4">
      <h2 class="mb-3">Bento Dashboard</h2>
      <!-- 2. DASHBOARD (Dùng CSS Grid - 2D, Dẹp bỏ Div Soup) -->
      <div class="grid-dashboard">
        <div class="widget widget-large">Chart A (Span 2 hàng x 2 cột)</div>
        <div class="widget">Chart B</div>
        <div class="widget">Chart C</div>
        <div class="widget">Chart D</div>
      </div>

      <h2 class="my-4">Bảng giá (Pricing)</h2>
      <!-- 3. PRICING (Dùng Bootstrap 12 columns grid system) -->
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <div class="card h-100 shadow-sm text-center">
            <div class="card-body">
              <h5 class="card-title">Gói Cơ bản</h5>
              <p class="card-text fs-4 fw-bold">$9/tháng</p>
              <button class="btn btn-outline-primary w-100">Đăng ký</button>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100 shadow-sm text-center border-primary">
            <div class="card-body">
              <h5 class="card-title text-primary">Gói Nâng cao</h5>
              <p class="card-text fs-4 fw-bold">$29/tháng</p>
              <button class="btn btn-primary w-100">Đăng ký</button>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card h-100 shadow-sm text-center">
            <div class="card-body">
              <h5 class="card-title">Gói Doanh nghiệp</h5>
              <p class="card-text fs-4 fw-bold">$99/tháng</p>
              <button class="btn btn-outline-primary w-100">Liên hệ</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
