<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Gallery</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .gallery-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .gallery-img:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <h2 class="text-center mb-4 font-weight-bold">
        Responsive Image Gallery
      </h2>

      <!-- Grid System với gap g-4 -->
      <div class="row g-4">
        <!-- Ảnh 1 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0">
            <img
              src="https://picsum.photos/400/300?random=1"
              class="gallery-img card-img-top"
              alt="Gallery Image 1"
            />
            <div class="card-body text-center p-2">
              <p class="card-text text-muted mb-0">Image 1</p>
            </div>
          </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0">
            <img
              src="https://picsum.photos/400/300?random=2"
              class="gallery-img card-img-top"
              alt="Gallery Image 2"
            />
            <div class="card-body text-center p-2">
              <p class="card-text text-muted mb-0">Image 2</p>
            </div>
          </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0">

              src="https://picsum.photos/400/300?random=3"
              class="gallery-img card-img-top"

            />

              <p class="card-text text-muted mb-0">Image 3</p>
            </div>
          </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0">
            <img
              src="https://picsum.photos/400/300?random=4"
              class="gallery-img card-img-top"
              alt="Gallery Image 4"
            />
            <div class="card-body text-center p-2">
              <p class="card-text text-muted mb-0">Image 4</p>
            </div>
          </div>
        </div>

        <!-- Ảnh 5 -->
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0">
            <img
              src="https://picsum.photos/400/300?random=5"
              class="gallery-img card-img-top"

            />

              <p class="card-text text-muted mb-0">Image 5</p>

        </div>

        <!-- Ảnh 7 -->

      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
