<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Layout HTML5 & CSS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Đầu trang -->
    <header>
      <h1>Header (Đầu trang)</h1>
    </header>

    <!-- Thanh điều hướng -->
    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Giới thiệu</a>
      <a href="#">Dịch vụ</a>
      <a href="#">Liên hệ</a>
    </nav>

    <!-- Vùng nội dung chính -->
    <div class="container">
      <section>
        <h2>Nội dung chính (Section)</h2>
        <article>
          <h3>Bài viết 1 (Article)</h3>
          <p>Mô tả chi tiết bài viết thứ nhất...</p>
        </article>
        <article>
          <h3>Bài viết 2 (Article)</h3>
          <p>Mô tả chi tiết bài viết thứ hai...</p>
        </article>
      </section>

      <!-- Thanh bên (Sidebar) -->
      <aside>
        <h3>Thanh bên (Aside)</h3>
        <p>Liên kết phụ, quảng cáo hoặc tin nổi bật.</p>
      </aside>
    </div>

    <!-- Chân trang -->
    <footer>
      <p>Footer (Chân trang) &copy; 2026 CodeGym</p>
    </footer>
  </body>
</html>
